<!DOCTYPE html>
<html>
<head>
<style>
  :root { --gold-gradient: linear-gradient(135deg, #f953f 0%, #FCF68A 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); --dark-bg: #0d0d0d; --card-bg: #1a1a1a; --text-gold: #dfb15b; }
  body { margin: 0; padding: 0; background-color: var(--dark-bg); color: #fff; font-family: Segoe UI, Tahoma, sans-serif; }
  h2 { text-align: center; color: #f39c12; margin-top: 20px; }
  .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; padding: 20px; }
  .game-card { background: var(--card-bg); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #2a2a2a; transition: 0.3s; }
  .game-icon { font-size: 40px; margin-bottom: 10px; }
  .game-title { font-weight: bold; margin-bottom: 5px; }
  .play-btn { background: var(--gold-gradient); border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<h2>Choose Your Game</h2>

<div class="games-grid">
  <div class="game-card">
    <div class="game-icon">✈️</div>
    <div class="game-title">Aviator</div>
    <button class="play-btn">Play Now</button>
  </div>
  <div class="game-card">
    <div class="game-icon">🐉</div>
    <div class="game-title">Dragon vs Tiger</div>
    <button class="play-btn">Play Now</button>
  </div>
  <div class="game-card">
    <div class="game-icon">🎲</div>
    <div class="game-title">Ludo Quick</div>
    <button class="play-btn">Play Now</button>
  </div>
  <div class="game-card">
    <div class="game-icon">🎰</div>
    <div class="game-title">Roulette</div>
    <button class="play-btn">Play Now</button>
  </div>
</div>

</body>
</html>
