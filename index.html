<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK TRIPLE 9</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; padding-bottom: 70px; }

    /* Top Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #1a1a1a; }
    .header .logo { font-size: 22px; font-weight: bold; color: #ff3b30; text-shadow: 0 0 5px #ff9500; }
    .header .menu-icon { font-size: 20px; color: #00d2ff; }

    /* Game Grid Section */
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
    .game-card { background: #1e1e1e; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #2c2c2e; text-align: center; }
    
    /* Badges */
    .badge-hot { position: absolute; top: 4px; left: 4px; background: #ff3b30; color: #fff; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; z-index: 2; }
    .badge-multiplier { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #ffd700; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 2; }

    /* Game Thumbnails */
    .card-img { width: 100%; height: 95px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; position: relative; }
    .aviator-bg { background: linear-gradient(180deg, #1f0000, #400000); color: #ff2a55; font-size: 18px; font-weight: bold; }
    .crazy-bg { background: linear-gradient(135deg, #11002c, #4a00e0); color: #ffd700; font-size: 26px; font-weight: bold; }
    .chicken-bg { background: linear-gradient(135deg, #0f2027, #203a43); color: #00ff87; font-size: 16px; font-weight: bold; }
    .money-bg { background: linear-gradient(135deg, #053705, #00d2ff); color: #00ff66; font-size: 22px; font-weight: bold; }

    .game-title { font-size: 11px; font-weight: bold; padding: 6px 2px; color: #ddd; background: #181818; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #161618; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #2a2a2a; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #8e8e93; font-size: 10px; text-decoration: none; }
    .nav-item.active { color: #00d2ff; }
    .nav-icon { font-size: 20px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="menu-icon">☰</div>
    <div class="logo">CT999</div>
    <div style="font-size: 18px;">💎</div>
  </div>

  <!-- 3-Column Games Grid -->
  <div class="game-grid">
    
    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img aviator-bg">✈️ Aviator</div>
      <div class="game-title">Aviator</div>
    </div>

    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <span class="badge-multiplier">10000x</span>
      <div class="card-img crazy-bg">777</div>
      <div class="game-title">Crazy777</div>
    </div>

    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img chicken-bg">🐔 ROAD</div>
      <div class="game-title">Chicken Road 2.0</div>
    </div>

    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img money-bg">💵💵</div>
      <div class="game-title">Money Coming</div>
    </div>

    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img crazy-bg">🏺 GEMS</div>
      <div class="game-title">Fortune Gems 3</div>
    </div>

    <div class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img aviator-bg">👑 KING</div>
      <div class="game-title">Fortune Gems 2</div>
    </div>

  </div>

  <!-- Bottom Nav Bar -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon">🎁</div>
      <span>Offers</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon">👛</div>
      <span>Deposit</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon">🎧</div>
      <span>Support</span>
    </a>
    <a href="#" class="nav-item">
      <div class="nav-icon">👤</div>
      <span>Profile</span>
    </a>
  </div>

</body>
</html>
