<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK TRIPLE 999</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; padding-bottom: 70px; }

    /* Top Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background-color: #1a1a1a; }
    .header .logo { font-size: 22px; font-weight: bold; color: #ff3333; }
    .header .menu-icon { font-size: 20px; color: #00d2ff; cursor: pointer; }

    /* Game Grid Section */
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
    
    /* Game Card Style Fix */
    .game-card { 
      background: #1e1e1e; 
      border-radius: 12px; 
      overflow: hidden; 
      position: relative; 
      text-decoration: none; 
      color: inherit; 
      display: block; 
      pointer-events: auto !important;
      cursor: pointer;
    }

    /* Badges */
    .badge-hot { position: absolute; top: 4px; left: 4px; background: #ff0000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; z-index: 2; }
    .badge-multiplier { position: absolute; top: 20px; left: 4px; font-size: 9px; color: #ffff00; font-weight: bold; z-index: 2; }

    /* Game Thumbnails */
    .card-img { width: 100%; height: 95px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px #000; }
    .aviator-bg { background: linear-gradient(135deg, #4a0000, #1a0000); }
    .crazy-bg { background: linear-gradient(135deg, #2b0054, #0f0022); }
    .chicken-bg { background: linear-gradient(135deg, #1f333a, #0b1417); }
    .money-bg { background: linear-gradient(135deg, #005e5d, #002b2a); }

    .game-title { font-size: 11px; font-weight: bold; padding: 6px; text-align: center; background: #252525; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #333; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 10px; }
    .nav-item.active { color: #00d2ff; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="menu-icon">☰</div>
    <div class="logo">PK 999</div>
    <div style="font-size: 18px;">💎</div>
  </div>

  <!-- 3-Column Games Grid (All Clickable Links) -->
  <div class="game-grid">

    <!-- Aviator -->
    <a href="aviator.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img aviator-bg">✈️ Aviator</div>
      <div class="game-title">Aviator</div>
    </a>

    <!-- Crazy777 -->
    <a href="crazy777.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <span class="badge-multiplier">10000x</span>
      <div class="card-img crazy-bg">🎰 777</div>
      <div class="game-title">Crazy777</div>
    </a>

    <!-- Chicken Road 2.0 -->
    <a href="chicken-road.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img chicken-bg">🐔 ROAD</div>
      <div class="game-title">Chicken Road 2.0</div>
    </a>

    <!-- Money Coming -->
    <a href="money-coming.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img money-bg">💵💵</div>
      <div class="game-title">Money Coming</div>
    </a>

    <!-- Fortune Gems 3 -->
    <a href="fortune-gems-3.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img crazy-bg">🏺 GEMS</div>
      <div class="game-title">Fortune Gems 3</div>
    </a>

    <!-- Fortune Gems 2 -->
    <a href="fortune-gems-2.html" class="game-card">
      <span class="badge-hot">HOT</span>
      <div class="card-img aviator-bg">👑 KING</div>
      <div class="game-title">Fortune Gems 2</div>
    </a>

  </div>

  <!-- Bottom Nav Bar -->
  <div class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </a>
    <a href="offers.html" class="nav-item">
      <div class="nav-icon">🎁</div>
      <span>Offers</span>
    </a>
    <a href="deposit.html" class="nav-item">
      <div class="nav-icon">👛</div>
      <span>Deposit</span>
    </a>
    <a href="support.html" class="nav-item">
      <div class="nav-icon">🎧</div>
      <span>Support</span>
    </a>
    <a href="profile.html" class="nav-item">
      <div class="nav-icon">👤</div>
      <span>Profile</span>
    </a>
  </div>

</body>
</html>
